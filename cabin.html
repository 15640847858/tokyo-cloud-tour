<style>

  #hint{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-size:11.5px;letter-spacing:.08em;color:rgba(253,246,224,.92);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap}

  #fwd:active{background:rgba(230,200,135,.35)}

  #joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(230,200,135,.35);border:1px solid rgba(230,200,135,.7);transform:translate(-50%,-50%);pointer-events:none}

  @media (max-width:640px){ #brand h1{font-size:17px} #bar{gap:8px;padding:7px 10px} .grp+.grp{padding-left:8px} .lab{display:none} }

<body>
<div id="app"></div>
<div id="brand"><h1>林 间 小 屋</h1><p>A CABIN IN THE WOODS</p><div class="sub">溪流 · 微风 · 四季天气</div></div>

  <div class="grp"><span class="lab">天气</span><button data-wx="clear" class="on">☀️ 晴</button><button data-wx="rain">🌧 雨</button><button data-wx="snow">❄️ 雪</button><button data-wx="night">🌙 夜</button></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ renderer / scene / camera ============ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth<=760?1.75:2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xdfeaf2, 0.011);
const camera=new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 600);
camera.position.set(20, 13, 24);

const controls=new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=3.5; controls.maxDistance=95; controls.enableZoom=true; controls.zoomSpeed=1.1;
controls.autoRotate=true; controls.autoRotateSpeed=0.55;

/* ============ sky dome + lights ============ */
const skyUni={ top:{value:new THREE.Color(0x6fa8ff)}, hor:{value:new THREE.Color(0xdcefff)}, off:{value:12}, exp:{value:0.9} };
const sky=new THREE.Mesh(new THREE.SphereGeometry(280, 24, 14), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:skyUni,
  vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform vec3 top; uniform vec3 hor; uniform float off; uniform float exp; varying vec3 vP; void main(){ float h=normalize(vP+vec3(0.0,off,0.0)).y; gl_FragColor=vec4(mix(hor, top, pow(max(h,0.0), exp)), 1.0); }'
}));
scene.add(sky);

const hemi=new THREE.HemisphereLight(0xbfdcff, 0x8a9a6a, 0.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe3b3, 2.6);
sun.position.set(38, 46, 20); sun.castShadow=true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-36; sun.shadow.camera.right=36; sun.shadow.camera.top=36; sun.shadow.camera.bottom=-36;
sun.shadow.camera.far=140; sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);
const lamp=new THREE.PointLight(0xffb45e, 0, 18, 1.8); lamp.position.set(1.5, 2.6, 5.4); scene.add(lamp);

/* ============ helpers ============ */
function cnv(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'), w, h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
function M(geo, mat, x=0, y=0, z=0, parent=scene){ const m=new THREE.Mesh(geo, mat); m.position.set(x,y,z); if(parent) parent.add(m); return m; }
function std(color, opt={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.92, metalness:0}, opt)); }
const rnd=(a,b)=>a+Math.random()*(b-a);

/* tile texture for the roof */
const tileTex=cnv(256,256,(g,w,h)=>{ g.fillStyle='#33465c'; g.fillRect(0,0,w,h); for(let y=0;y<8;y++){ for(let x=0;x<8;x++){ const v=(x+y)%2? 6:-4; g.fillStyle=`rgb(${52+v},${72+v},${94+v})`; g.fillRect(x*32+1, y*32+1, 30, 30); g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(x*32+1, y*32+1, 30, 5); g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(x*32+1, y*32+26, 30, 5); } } });
tileTex.repeat.set(3,2);
/* grass ground texture */
const grassTex=cnv(256,256,(g,w,h)=>{ g.fillStyle='#6f9e4a'; g.fillRect(0,0,w,h); for(let i=0;i<2600;i++){ g.fillStyle=`rgba(${40+Math.random()*40|0},${110+Math.random()*60|0},${40+Math.random()*30|0},.5)`; g.fillRect(Math.random()*w, Math.random()*h, 1.6, 3.6); } for(let i=0;i<260;i++){ g.fillStyle='rgba(230,220,150,.16)'; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); } });
grassTex.repeat.set(10,10);
/* water streak texture */
const waterTex=cnv(256,256,(g,w,h)=>{ g.fillStyle='#3d7ea6'; g.fillRect(0,0,w,h); for(let i=0;i<130;i++){ g.strokeStyle=`rgba(255,255,255,${.05+Math.random()*.13})`; g.lineWidth=1+Math.random()*1.6; const y=Math.random()*h; g.beginPath(); g.moveTo(Math.random()*w*.5, y); g.lineTo(w*.5+Math.random()*w*.5, y+rnd(-3,3)); g.stroke(); } for(let i=0;i<300;i++){ g.fillStyle='rgba(10,40,60,.14)'; g.fillRect(Math.random()*w, Math.random()*h, 3, 2); } });
waterTex.repeat.set(1,7);
/* soft round sprite (smoke / fireflies / snow) */
const dotTex=cnv(64,64,(g,w,h)=>{ const r=g.createRadialGradient(32,32,2,32,32,30); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.55,'rgba(255,255,255,.45)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,w,h); });

/* ============ island terrain ============ */
const ISLAND_R=30;
const streamCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-34, 0, -13), new THREE.Vector3(-22, 0, -8), new THREE.Vector3(-13.5, 0, -3.4),
  new THREE.Vector3(-9.5, 0, 3.6), new THREE.Vector3(-11.5, 0, 10.5), new THREE.Vector3(-6.5, 0, 16.5),
  new THREE.Vector3(2.5, 0, 19.5), new THREE.Vector3(12, 0, 22.5), new THREE.Vector3(24, 0, 26), new THREE.Vector3(34, 0, 30)
]);
const streamPts=streamCurve.getSpacedPoints(120);
function distToStream(x, z){ let d=1e9; for(const p of streamPts){ const dx=p.x-x, dz=p.z-z; const dd=dx*dx+dz*dz; if(dd<d) d=dd; } return Math.sqrt(d); }
function groundH(x, z){
  const r=Math.hypot(x, z);
  let h=0.55*Math.exp(-(r*r)/(2*26*26)) + 0.35*Math.sin(x*0.16)*Math.cos(z*0.13);
  const ds=distToStream(x, z);
  if(ds<3.4) h-= (3.4-ds)*0.16;              /* carve the stream bed */
  if(r>ISLAND_R-2) h-= (r-(ISLAND_R-2))*0.85; /* island falls away at the rim */
  return h;
}
/* surrounding water table far below the rim */
const sea=M(new THREE.CircleGeometry(260, 40), new THREE.MeshPhongMaterial({color:0x39698c, transparent:true, opacity:.92, shininess:120}), 0, -2.6, 0);
sea.rotation.x=-Math.PI/2;

const groundGeo=new THREE.CircleGeometry(ISLAND_R+6, 96, 0, Math.PI*2);
groundGeo.rotateX(-Math.PI/2);
{ const pos=groundGeo.attributes.position; const col=[]; const cA=new THREE.Color(0x77a24e), cB=new THREE.Color(0x5d8a3e), cC=new THREE.Color(0x9aa356), tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), z=pos.getZ(i); pos.setY(i, groundH(x,z));
    const n=Math.sin(x*0.55+z*0.3)*Math.cos(z*0.45-x*0.2);
    tmp.copy(cA).lerp(n>0.25? cC : cB, Math.min(1, Math.abs(n)*1.2)); col.push(tmp.r, tmp.g, tmp.b); }
  groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); groundGeo.computeVertexNormals(); }
const groundMat=new THREE.MeshStandardMaterial({map:grassTex, vertexColors:true, roughness:1});
const ground=M(groundGeo, groundMat); ground.receiveShadow=true;
const snowGround=M(groundGeo.clone(), new THREE.MeshStandardMaterial({color:0xeef3f8, roughness:.95, transparent:true, opacity:0}), 0, 0.05, 0);
snowGround.receiveShadow=true;

/* ============ stream ============ */
function ribbon(curve, width, y){
  const pts=curve.getSpacedPoints(140); const verts=[], uvs=[], idx=[];
  for(let i=0;i<pts.length;i++){ const p=pts[i]; const t=curve.getTangent(i/(pts.length-1));
    const nx=-t.z, nz=t.x; const hw=width/2;
    verts.push(p.x+nx*hw, y, p.z+nz*hw, p.x-nx*hw, y, p.z-nz*hw); uvs.push(0, i/6, 1, i/6);
    if(i>0){ const a=(i-1)*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); } }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const waterMat=new THREE.MeshPhongMaterial({map:waterTex, color:0x9fd4e8, transparent:true, opacity:.88, shininess:180, specular:0xbfe8ff});
const water=M(ribbon(streamCurve, 3.6, 0.34), waterMat); water.position.y=0;
/* icy strips along the banks for snow mode */
const iceMat=new THREE.MeshStandardMaterial({color:0xdceef7, roughness:.35, transparent:true, opacity:0});
const ice1=M(ribbon(streamCurve, 4.6, 0.37), iceMat); ice1.scale.set(1.001,1,1.001);

/* bank rocks: instanced dodecahedrons lining the stream + scattered boulders */
const rockMat=std(0x8b8d89, {roughness:1});
const rockGeo=new THREE.DodecahedronGeometry(0.32, 0);
const rocks=new THREE.InstancedMesh(rockGeo, rockMat, 340);
{ const d=new THREE.Object3D(); let n=0;
  for(let i=0;i<streamPts.length && n<300;i+=1){ const p=streamPts[i];
    for(const s of [-1,1]){ if(n>=300) break; const t=streamCurve.getTangent(i/(streamPts.length-1)); const nx=-t.z, nz=t.x;
      const x=p.x+nx*s*rnd(1.85,2.25), z=p.z+nz*s*rnd(1.85,2.25);
      d.position.set(x, groundH(x,z)+0.05, z); d.rotation.set(rnd(0,3), rnd(0,3), rnd(0,3)); const sc=rnd(0.5,1.25); d.scale.set(sc, sc*0.72, sc); d.updateMatrix(); rocks.setMatrixAt(n++, d.matrix); } }
  while(n<340){ const a=rnd(0,Math.PI*2), r=rnd(12,27); const x=Math.cos(a)*r, z=Math.sin(a)*r; if(distToStream(x,z)<3) continue;
    d.position.set(x, groundH(x,z)+0.04, z); d.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3)); const sc=rnd(0.7,1.9); d.scale.set(sc, sc*0.7, sc); d.updateMatrix(); rocks.setMatrixAt(n++, d.matrix); }
  rocks.count=n; }
rocks.castShadow=true; rocks.receiveShadow=true; scene.add(rocks);

/* stepping-stone path from the veranda to the bridge */
const stoneMat=std(0x9a978c, {roughness:1});
[[-1.2,6.4],[-2.6,7.6],[-4.2,8.8],[-5.8,10.0],[-7.4,11.2]].forEach(([x,z])=>{
  const st=M(new THREE.CylinderGeometry(rnd(.5,.66), rnd(.56,.72), 0.14, 7), stoneMat, x, groundH(x,z)+0.1, z);
  st.castShadow=true; st.receiveShadow=true; });

/* small wooden bridge over the stream */
const bridge=new THREE.Group(); scene.add(bridge);
const woodMat=std(0x8a6844, {roughness:.85}); const woodDark=std(0x6b4e30, {roughness:.9});
{ const bx=-9.6, bz=12.4; bridge.position.set(bx, 0, bz); bridge.rotation.y=Math.atan2(-(streamCurve.getTangent(0.55).x), streamCurve.getTangent(0.55).z)+Math.PI/2;
  for(let i=0;i<9;i++){ const t=i/8, px=(t-0.5)*5.6, py=Math.sin(t*Math.PI)*0.55+0.62;
    const pl=M(new THREE.BoxGeometry(0.62, 0.09, 3.4), woodMat, px, py, 0, bridge); pl.castShadow=true; pl.receiveShadow=true; }
  for(const s of [-1.55, 1.55]){ for(let i=0;i<4;i++){ const t=i/3, px=(t-0.5)*5.6, py=Math.sin(t*Math.PI)*0.55+0.62;
      M(new THREE.BoxGeometry(0.09, 0.85, 0.09), woodDark, px, py+0.4, s, bridge); }
    const rail=M(new THREE.BoxGeometry(5.8, 0.08, 0.08), woodDark, 0, 1.55, s, bridge); rail.rotation.z=0; }
  for(const s of [-1.4, 1.4]) for(const px of [-2.6, 2.6]) M(new THREE.BoxGeometry(0.22, 1.3, 0.22), woodDark, px, 0.1, s, bridge);
}

/* ============ the cabin ============ */
const house=new THREE.Group(); house.position.set(0.6, groundH(0.6,-1.2), -1.2); house.rotation.y=-0.16; scene.add(house);
const wallMat=std(0xf1ead9, {roughness:.95});
const timberMat=std(0x4a3826, {roughness:.9});
const foundMat=std(0x7e7c74, {roughness:1});
const roofMat=new THREE.MeshStandardMaterial({map:tileTex, roughness:.82});
const roofSnowMat=new THREE.MeshStandardMaterial({color:0xf2f6fa, roughness:.9, transparent:true, opacity:0});
const winMat=new THREE.MeshStandardMaterial({color:0x5a4c34, emissive:0xffb45e, emissiveIntensity:0, roughness:.4});
function sh(m){ m.castShadow=true; m.receiveShadow=true; return m; }
{ /* foundation + floor */
  sh(M(new THREE.BoxGeometry(9.0, 0.55, 7.0), foundMat, 0, 0.27, 0, house));
  sh(M(new THREE.BoxGeometry(8.6, 0.16, 6.6), woodDark, 0, 0.6, 0, house));
  /* walls: perimeter segments with a real door opening in the front wall
     (door gap x -2.18..-1.02, head height 2.75) so the cabin can be entered */
  sh(M(new THREE.BoxGeometry(2.02, 3.0, 0.5), wallMat, -3.19, 2.1, 2.95, house));
  sh(M(new THREE.BoxGeometry(5.22, 3.0, 0.5), wallMat, 1.59, 2.1, 2.95, house));
  sh(M(new THREE.BoxGeometry(1.16, 0.85, 0.5), wallMat, -1.6, 3.18, 2.95, house));
  sh(M(new THREE.BoxGeometry(8.4, 3.0, 0.5), wallMat, 0, 2.1, -2.95, house));
  sh(M(new THREE.BoxGeometry(0.5, 3.0, 5.4), wallMat, -3.95, 2.1, 0, house));
  sh(M(new THREE.BoxGeometry(0.5, 3.0, 5.4), wallMat, 3.95, 2.1, 0, house));
  /* ceiling so the room reads as a room from inside */
  sh(M(new THREE.BoxGeometry(8.4, 0.12, 6.4), woodDark, 0, 3.56, 0, house));
  /* ---- interior ---- */
  const tatamiMat=std(0xcfc08a, {roughness:1});
  for(const dx of [-0.61, 1.21]) for(const dz of [-0.21, 0.71]){
    sh(M(new THREE.BoxGeometry(1.78, 0.05, 0.88), tatamiMat, dx, 0.71, dz, house));
    M(new THREE.BoxGeometry(1.84, 0.03, 0.94), timberMat, dx, 0.685, dz, house); }
  /* low round table + teapot + cushions */
  sh(M(new THREE.CylinderGeometry(0.58, 0.58, 0.05, 18), woodMat, 0.3, 1.05, 0.25, house));
  sh(M(new THREE.CylinderGeometry(0.07, 0.09, 0.3, 8), woodDark, 0.3, 0.88, 0.25, house));
  M(new THREE.SphereGeometry(0.13, 12, 10), std(0x37424e, {roughness:.35, metalness:.5}), 0.42, 1.16, 0.18, house);
  M(new THREE.CylinderGeometry(0.3, 0.32, 0.08, 14), std(0x51638c, {roughness:.9}), 0.3, 0.78, 1.25, house);
  M(new THREE.CylinderGeometry(0.3, 0.32, 0.08, 14), std(0xa8542f, {roughness:.9}), 0.3, 0.78, -0.75, house);
  /* irori hearth under the chimney: sand box, logs, flame, warm light */
  sh(M(new THREE.BoxGeometry(1.1, 0.14, 1.1), std(0x5c564c, {roughness:1}), 2.3, 0.72, -0.9, house));
  for(let i=0;i<3;i++){ const lg=M(new THREE.CylinderGeometry(0.055, 0.055, 0.62, 6), timberMat, 2.3+Math.cos(i*2.1)*0.14, 0.84, -0.9+Math.sin(i*2.1)*0.14, house); lg.rotation.z=Math.PI/2; lg.rotation.y=i*2.1; }
  const flameMat=new THREE.MeshStandardMaterial({color:0x572a08, emissive:0xff7a26, emissiveIntensity:2.4, roughness:1});

const _hv=new THREE.Vector3();

function floorHeightAt(wx, wz){

  if(Math.abs(lx)<3.95 && Math.abs(lz)<2.95) return hy+0.68;
  if(Math.abs(lx+1.6)<0.62 && lz>=2.6 && lz<3.4) return hy+0.68;
  if(Math.abs(lx)<4.35 && lz>=2.95 && lz<4.95) return hy+0.79;

const WALLS=[ /* house-local AABBs: front segments (door gap left open), back, sides, furniture */
  {x1:-4.2, x2:-2.18, z1:2.70, z2:3.20}, {x1:-1.02, x2:4.2, z1:2.70, z2:3.20},
  {x1:-4.2, x2:4.2, z1:-3.20, z2:-2.70},
  {x1:-4.20, x2:-3.70, z1:-2.70, z2:2.70}, {x1:3.70, x2:4.20, z1:-2.70, z2:2.70},

function collide(nx, nz, r){

    if(d<min && d>0.001){ nx=ginkPos.x+dx/d*min; nz=ginkPos.z+dz/d*min; } }

function tickFP(dt){
  const sp=(fp.keys.ShiftLeft||fp.keys.ShiftRight)? 7.2 : 4.2;
  const f=(fp.keys.KeyW||fp.keys.ArrowUp||fp.fwd)? 1:0, b=(fp.keys.KeyS||fp.keys.ArrowDown)? 1:0;
  const l=(fp.keys.KeyA||fp.keys.ArrowLeft)? 1:0, r=(fp.keys.KeyD||fp.keys.ArrowRight)? 1:0;
  const sin=Math.sin(fp.yaw), cos=Math.cos(fp.yaw);
  let mx=(-sin*(f-b) + cos*(r-l)), mz=(-cos*(f-b) - sin*(r-l));
  const ml=Math.hypot(mx, mz); const moving=ml>0.01;
  if(moving){ mx=mx/ml*sp*dt; mz=mz/ml*sp*dt;
    const [nx, nz]=collide(camera.position.x+mx, camera.position.z+mz, 0.34);
    camera.position.x=nx; camera.position.z=nz;
    fp.bob+=dt*8;
  }
  const gy=floorHeightAt(camera.position.x, camera.position.z)+1.7+(moving? Math.sin(fp.bob)*0.05 : 0);
  camera.position.y+=(gy-camera.position.y)*Math.min(1, dt*12);
  const dir=new THREE.Vector3(-Math.sin(fp.yaw)*Math.cos(fp.pitch), Math.sin(fp.pitch), -Math.cos(fp.yaw)*Math.cos(fp.pitch));
  camera.lookAt(camera.position.clone().add(dir));
}
function tickTP(dt){

  const f=(fp.keys.KeyW||fp.keys.ArrowUp||fp.fwd)? 1:0, b=(fp.keys.KeyS||fp.keys.ArrowDown)? 1:0;
  const l=(fp.keys.KeyA||fp.keys.ArrowLeft)? 1:0, r=(fp.keys.KeyD||fp.keys.ArrowRight)? 1:0;
  let f2=f-b, r2=r-l;
  if(joy.on){ f2+=-joy.y; r2+=joy.x; }
  const s=Math.sin(tp.camYaw), c=Math.cos(tp.camYaw);
  let mx=(-s*f2 + c*r2), mz=(-c*f2 - s*r2);
  const ml=Math.hypot(mx, mz); const moving=ml>0.05;
  if(moving){ const spF=Math.min(1, ml); mx/=ml; mz/=ml;
    const tgtA=Math.atan2(mx, mz);
    let dh=tgtA-tp.head; while(dh>Math.PI) dh-=Math.PI*2; while(dh<-Math.PI) dh+=Math.PI*2;
    tp.head+=dh*Math.min(1, dt*10);
    const [nx, nz]=collide(tp.pos.x+mx*sp*spF*dt, tp.pos.z+mz*sp*spF*dt, 0.34);
    tp.pos.x=nx; tp.pos.z=nz; tp.phase+=dt*sp*spF*2.4;

  const gy=floorHeightAt(tp.pos.x, tp.pos.z);
  charG.position.set(tp.pos.x, charG.position.y+(gy-charG.position.y)*Math.min(1, dt*10), tp.pos.z);
  charG.rotation.y=tp.head;

  charParts.armL.rotation.x=-sw*0.8; charParts.armR.rotation.x=sw*0.8;

  camera.position.lerp(_hv, Math.min(1, dt*5.5));
  camera.lookAt(tp.pos.x, charG.position.y+1.35, tp.pos.z);
}

      if(y<0){ y=28; x=rnd(-38,38); pos.setZ(i, rnd(-38,38)); } pos.setY(i, y); pos.setX(i, x); }
    pos.needsUpdate=true; }
  if(cur.fly>0.02){ const pos=flyPts.geometry.attributes.position; const seed=flyPts.userData.seed;
    for(let i=0;i<pos.count;i++){ const bx=Math.sin(seed[i])*11, bz=Math.cos(seed[i]*1.3)*11;
      pos.setXYZ(i, bx+Math.sin(t*0.4+seed[i])*2.2, 1.3+Math.sin(t*0.8+seed[i]*2)*0.7, bz+Math.cos(t*0.33+seed[i])*2.2); }
    pos.needsUpdate=true; }
  if(AC && sndOn && curWx==='clear'){ birdTimer-=dt; if(birdTimer<=0){ chirp(); birdTimer=rnd(3.5, 9); } }
  { const fr=house.userData.fire;
    if(fr){ const fl=0.85+0.22*Math.sin(t*13.7)*Math.sin(t*7.3+1.7);
      fr.light.intensity=(3+cur.lamp*0.4)*fl;
      fr.mat.emissiveIntensity=2.4*fl;
      fr.flames.forEach((fm, i)=>{ fm.scale.y=fl*(1+i*0.07); }); } }
  if(ginkFall){ const show=(curWx==='clear'||curWx==='night');
    ginkFall.visible=show;
    if(show){ const pos=ginkFall.geometry.attributes.position; const seed=ginkFall.userData.seed;
      for(let i=0;i<pos.count;i++){ let y=pos.getY(i)-dt*(0.5+(seed[i]%0.5));
        let x=pos.getX(i)+Math.sin(t*1.2+seed[i])*dt*0.7;
        if(y<0.15){ y=rnd(8,11); const a=rnd(0,6.3), r=rnd(0.5,5.2); x=Math.cos(a)*r; pos.setZ(i, Math.sin(a)*r); }
        pos.setY(i, y); pos.setX(i, x); }
      pos.needsUpdate=true; } }
  if(mode==='fp') tickFP(dt); else if(mode==='tp') tickTP(dt); else controls.update();
  renderer.render(scene, camera);
  if(firstFrame){ firstFrame=false; window.__cabinOK=true; document.getElementById('loading').classList.add('gone');
    setTimeout(()=>showHint('小屋可以推门进去 · 第三人称能带小人散步 · 屋旁有一棵大银杏', 4600), 600); }
}
applyEnv();
animate();
</script>
<script>
setTimeout(function(){ if(!window.__cabinOK){ var l=document.getElementById('loading'); if(l) l.style.display='none'; var e=document.getElementById('err'); if(e) e.style.display='flex'; } }, 15000);
</script>
